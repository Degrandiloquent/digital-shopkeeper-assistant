name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopkeeper
          POSTGRES_PASSWORD: shopkeeper
          POSTGRES_DB: shopkeeper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopkeeper" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app
      - name: Tests on PostgreSQL (includes the concurrent-sale race test and migration check)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://shopkeeper:shopkeeper@localhost:5432/shopkeeper_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        env:
          API_URL: https://example.invalid
        run: npm run build:render
