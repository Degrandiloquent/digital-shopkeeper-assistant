server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Hashed build files never change, so browsers may keep them for a year (saves data on repeat visits).
  location ~* \.(?:js|css|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must always be fresh so a new deploy is picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Single-page app: unknown paths serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
